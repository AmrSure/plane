# Local deployment tweaks on top of docker-compose.yml.
services:
  # The live server validates its env on startup, so it needs an env_file.
  live:
    env_file:
      - ./apps/live/.env
    depends_on:
      - api
      - plane-redis

  # MinIO no longer publishes community images on Docker Hub or Quay.
  # Chainguard ships the same MinIO server binary as a free public image.
  # It runs as a non-root user by default, so run as root to write the
  # named volume mounted at /export.
  plane-minio:
    image: cgr.dev/chainguard/minio:latest
    user: "0"

  # The Caddyfile needs SITE_ADDRESS, CERT_* and TRUSTED_PROXIES at runtime.
  # docker-compose.yml does not pass them, so Caddy fails with an empty site block.
  proxy:
    env_file:
      - ./.env
